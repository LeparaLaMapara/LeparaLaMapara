name: Rank marshal

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.55.3
      - name: Taxi picks up contributions
        run: python tools/taxi.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh the rank board
        run: python tools/live.py
      - name: Commit if anything changed
        run: |
          git config user.name "rank-marshal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/taxi-light.svg assets/taxi-dark.svg
          git diff --cached --quiet || git commit -m "Rank marshal: daily board"
          git push
